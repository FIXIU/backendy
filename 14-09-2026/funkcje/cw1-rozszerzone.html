<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>cwiczenie 1.2</title>
  </head>
  <body>
    <label for="numberInput">liczba: </label>
    <input type="number" id="numberInput" /><br /><br />

    <button onclick="displayOppositeNumber()">oblicz liczbę przeciwną</button>

    <script>
      function getOppositeNumber(number) {
        return -number;
      }

      function displayOppositeNumber() {
        let number = document.getElementById("numberInput").value;

        alert("liczba przeciwna: " + getOppositeNumber(Number(number)));
      }
    </script>
  </body>
</html>
