<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>cwiczenie 4.2</title>
  </head>
  <body>
    <label for="numbersInput">liczby (oddzielone przecinkami): </label>
    <input type="text" id="numbersInput" placeholder="2,1,3,7" /><br /><br />

    <button onclick="analyzeNumbers()">oblicz srednią itd.</button>

    <script>
      function analyzeNumbers() {
        let input = document.getElementById("numbersInput").value;
        let numbers = input.split(",").map(Number);

        let sum = 0;
        let min = numbers[0];
        let max = numbers[0];

        for (let number of numbers) {
          sum += number;
          if (number < min) {
            min = number;
          }
          if (number > max) {
            max = number;
          }
        }

        let average = sum / numbers.length;

        alert("średnia: " + average + "\nmin: " + min + "\nmax: " + max);
      }
    </script>
  </body>
</html>
