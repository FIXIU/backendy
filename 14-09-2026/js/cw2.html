<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>cwiczenie 2</title>
  </head>
  <body>
    <h2>lista zakupów:</h2>
    <ul id="shoppingList"></ul>

    <script>
      let productsToBuy = ["dwa bułki", "chleb", "kiełbasa"];
      let shoppingList = document.getElementById("shoppingList");

      for (let product of productsToBuy) {
        shoppingList.innerHTML += "<li>" + product + "</li>";
      }
    </script>
  </body>
</html>
