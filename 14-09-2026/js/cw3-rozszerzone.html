<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>cwiczenie 3.2</title>
  </head>
  <body>
    <label for="ageInput">wiek:</label>
    <input type="number" id="ageInput" min="0" />
    <button onclick="checkAge()">sprawdź pełnoletność</button>

    <script>
      function checkAge() {
        let age = document.getElementById("ageInput").value;

        if (age >= 18) {
          alert("pełnoletni");
        } else {
          alert("niepełnoletni");
        }
      }
    </script>
  </body>
</html>
